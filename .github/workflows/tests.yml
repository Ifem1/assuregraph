name: contract checks

on:
  push:
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static preflight
        run: python scripts/preflight.py
      - name: Compile Python sources
        run: python -m py_compile contracts/*.py tests/direct/*.py tests/integration/*.py scripts/*.py

  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Direct Mode tooling
        run: python -m pip install -r requirements-test.txt
      - name: Direct Mode tests
        run: pytest tests/direct -q
